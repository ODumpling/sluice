# Sluice environment spec for billing-demo-go (Go + Postgres + Stripe).
version: 1
name: billing-demo-go
sandbox:
  services:
    db:
      image: postgres:16-alpine
      env:
        POSTGRES_USER: sluice
        POSTGRES_PASSWORD: sluice
        POSTGRES_DB: billing
      ports: [5432]
      ready:
        exec: [pg_isready, -U, sluice, -d, billing, -h, 127.0.0.1]
    app:
      build: .
      workdir: /app
      source: src
      # compiles ./src (mounted read-only) at start; modules + build cache are in the image
      command: [sh, -c, "go build -ldflags='-s -w' -o /tmp/billing-demo . && exec /tmp/billing-demo"]
      env:
        PORT: '3000'
        DATABASE_URL: postgres://sluice:sluice@db:5432/billing
        STRIPE_API_BASE: ${fakes.stripe.url}
        STRIPE_SECRET_KEY: sk_test_sluice_billing_demo
      ports: [3000]
      dependsOn: [db]
      determinism: go
      ready:
        http: { port: 3000, path: /health }
  fakes: [stripe]
  ingress: { service: app, port: 3000 }
  database:
    service: db
    port: 5432
    user: sluice
    password: sluice
    name: billing
pluginConfig:
  gate:
    mutation: { maxMutants: 10, threshold: 0.8 }
    unitTests: { service: app, command: [go, test, ./test/], mounts: [src, test] }
