# sluice bench mine -c dotnet.bench.yaml && sluice bench run -c dotnet.bench.yaml
# A small synthetic .NET solution (synth/make-repos.mjs, vendored as a bundle)
# with external NuGet packages (Humanizer.Core, xunit). Nothing but the source
# and agents is configured: image (dotnet/sdk), test command (`dotnet test`),
# test files (`.cs` under a `*Tests/` project) and the dependency prepare step
# (`dotnet restore` of every project, run with network at image build time;
# tests stay offline) come from the detected toolchain.
name: dotnet-textkit
source:
  bundle: dotnet-textkit.bundle
  repo: example/dotnet-textkit
mine:
  limit: 10
  timeoutSec: 120
agents:
  - name: oracle
    command: node ${benchDir}/agents/oracle.mjs
    oracle: true
    timeoutSec: 120
  - name: first-file
    command: node ${benchDir}/agents/first-file.mjs
    oracle: true
    timeoutSec: 120
