name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Go + .NET SDKs: the gate's mutation tests compile every generated Go/C#
      # mutant of a fixture (go build / dotnet build, a few seconds)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          SLUICE_TEST_DOTNET: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
      - name: CLI smoke test
        run: node surfaces/cli/bin/sluice.js --help

  integration:
    name: integration (Docker sandboxes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pre-pull sandbox images
        # node/go/dotnet: the north-star demo apps (test/e2e/north-star*.itest.ts);
        # alpine + debian: builders for the `determinism: dotnet` shim
        run: >-
          printf '%s\n' node:22-alpine postgres:16-alpine golang:1.27-alpine golang:1.22-alpine mcr.microsoft.com/dotnet/sdk:10.0
          alpine:3.20 debian:bookworm-slim | xargs -P 6 -n 1 docker pull -q
      - run: pnpm test:integration
      - name: Clean up sandboxes
        if: always()
        run: node surfaces/cli/bin/sluice.js down || true

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:build
      - name: Generated CLI reference is committed
        run: git diff --exit-code docs/reference/cli.md

  packaging:
    name: npm packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:smoke

  demo:
    name: one-command demo from a clean clone (< 10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm demo (no prior install or build)
        run: |
          start=$SECONDS
          pnpm demo
          elapsed=$((SECONDS - start))
          echo "demo took ${elapsed}s"
          echo "### pnpm demo: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 600 ]; then echo "::error::quickstart demo took ${elapsed}s (> 10 min)"; exit 1; fi
