name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm test
      - name: Tag matches package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const v=process.argv[1];const fs=require('fs');for(const d of ['core','plugins','surfaces'])for(const p of fs.readdirSync(d)){const f=d+'/'+p+'/package.json';if(!fs.existsSync(f))continue;const j=JSON.parse(fs.readFileSync(f));if(j.version!==v){console.error(f+' is '+j.version+', tag is '+v);process.exit(1)}}" "$v"
      # Trusted Publishing: npm exchanges this workflow's GitHub OIDC identity
      # (id-token: write) for a short-lived publish token. No NPM_TOKEN secret.
      # One-time setup per package: see RELEASING.md.
      - name: npm with OIDC support
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish @sluice-dev/* to npm (OIDC)
        run: node scripts/npm-release.mjs publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Sluice $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag || gh release edit "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
