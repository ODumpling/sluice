name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm test
      - name: Tag matches package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const v=process.argv[1];const fs=require('fs');for(const d of ['core','plugins','surfaces'])for(const p of fs.readdirSync(d)){const f=d+'/'+p+'/package.json';if(!fs.existsSync(f))continue;const j=JSON.parse(fs.readFileSync(f));if(j.version!==v){console.error(f+' is '+j.version+', tag is '+v);process.exit(1)}}" "$v"
      - name: Publish @sluice-dev/* to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish (add it under Settings → Secrets → Actions and re-run this job)"
            exit 0
          fi
          pnpm -r --filter "./core/**" --filter "./plugins/**" --filter "./surfaces/**" publish --access public --no-git-checks --provenance
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Sluice $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag || gh release edit "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
